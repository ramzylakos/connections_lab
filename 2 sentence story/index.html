<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Loop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container"></div>
<div id="hint">click anywhere</div>

<svg id="clock" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="46" fill="none" stroke="#777" stroke-width="3" />
  <line id="hourHand" x1="50" y1="50" x2="50" y2="30" stroke="#eee" stroke-width="4" stroke-linecap="round" />
  <line id="minuteHand" x1="50" y1="50" x2="50" y2="16" stroke="#eee" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="50" r="3" fill="#eee" />
</svg>

<script src="script.js"></script>

</body>
</html>
